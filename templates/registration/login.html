<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Apna Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #e85d04;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e85d04;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e85d04;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #d94f00;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e85d04;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🛒 <span>Apna</span> Market
    </div>

    <p class="subtitle">
        Login to continue shopping
    </p>

    {% if form.errors %}
        <div class="error">
            Username ya password galat hai.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="id_username">
            Username
        </label>

        <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Enter username"
            required
            autofocus
        >

        <label for="id_password">
            Password
        </label>

        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Enter password"
            required
        >

        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Apna Market
    </a>

</div>

</body>
</html>
