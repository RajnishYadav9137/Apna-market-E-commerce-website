```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Apna Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #e85d04;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .helptext {
            font-size: 12px;
            color: #777;
        }

        ul.errorlist {
            color: #c00;
            margin-bottom: 8px;
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e85d04;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #d94f00;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #e85d04;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        🛒 <span>Apna</span> Market
    </div>

    <h1>Create Account</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

    <div class="home">
        <a href="{% url 'home' %}">
            ← Back to Home
        </a>
    </div>

</div>

</body>

</html>
```
